<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Positioning Task</title>
    <style>
      .box-static {
        width: 100px;
        height: 100px;
        background-color: #80deec;
        margin-bottom: 10px;
        position: static;
      }

      .box-relative-1 {
        width: 100px;
        height: 100px;
        background-color: #98e598;
        position: relative;
        top: 10px;
      }

      .box-relative-2 {
        width: 100px;
        height: 100px;
        background-color: #ffb6c1;
        position: relative;
        top: -10px;
        left: 10px;
      }

      .container {
        width: 350px;
        height: 350px;
        background-color: #d3d3d3;
        position: relative;
        margin-top: 50px;
        margin-left: 50px;
      }

      .box-absolute-1 {
        width: 90px;
        height: 90px;
        background-color: #ff7f50;
        position: absolute;
        top: 30px;
        left: 30px;
        z-index: 4;
      }

      .box-absolute-2 {
        width: 100px;
        height: 100px;
        background-color: #87ceeb;
        position: absolute;
        top: 90px;
        left: 90px;
        z-index: 3;
      }

      .box-absolute-3 {
        width: 110px;
        height: 110px;
        background-color: #800080;
        position: absolute;
        top: 170px;
        left: 140px;
      }

      .box-zindex-1 {
        width: 150px;
        height: 150px;
        background-color: #f08080;
        position: absolute;
        top: 40px;
        left: 350px;
        z-index: 5;
      }

      .box-zindex-2 {
        width: 150px;
        height: 150px;
        background-color: #20b2aa;
        position: absolute;
        top: 100px;
        left: 450px;
        z-index: 4;
      }

      .box-fixed-1 {
        width: 80px;
        height: 80px;
        background-color: #ffd700;
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 10;
      }

      .box-fixed-2 {
        width: 80px;
        height: 80px;
        background-color: #ffa500;
        position: fixed;
        bottom: 10px;
        left: 10px;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <!-- Static positioned boxes -->
    <div class="box-static">Static</div>
    <div class="box-static">Static</div>

    <!-- Relative positioned boxes -->
    <div class="box-relative-1">Relative 1</div>
    <div class="box-relative-2">Relative 2</div>

    <!-- Container with absolute positioned boxes inside -->
    <div class="container">
      <div class="box-absolute-1">Absolute 1</div>
      <div class="box-absolute-2">Absolute 2</div>
      <div class="box-absolute-3">Absolute 3</div>
    </div>

    <!-- Overlapping boxes with z-index outside container -->
    <div class="box-zindex-1">Z-Index 5</div>
    <div class="box-zindex-2">Z-Index 4</div>

    <!-- Fixed positioned boxes -->
    <div class="box-fixed-1">Fixed Top-Right</div>
    <div class="box-fixed-2">Fixed Bottom-Left</div>
  </body>
</html>
